# Generic Argo Application — NO site hosts/buckets in Git.
# After secrets, run:  ./scripts/configure_argo_site.sh
# That patches helm.parameters from your env (FEAST_BUCKET, PIPELINE_BUCKET, AWS_S3_ENDPOINT).
apiVersion: v1
kind: Namespace
metadata:
  name: fd-gitops
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/feast: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-fd-gitops-admin
  namespace: fd-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
  - kind: ServiceAccount
    name: argocd-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-gitops
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/varunchach/fd_demo.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values.yaml
      # parameters injected at runtime by scripts/configure_argo_site.sh
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
