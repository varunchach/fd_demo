apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-detection-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/varunchach/fd_demo.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fraud-detection
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
