# Site-specific S3 host/buckets live HERE as helm.parameters — not hardcoded in chart/values.yaml.
# Change parameters for your environment; keep chart defaults empty/generic.
#
# Prerequisites: secrets in fd-gitops (FEAST_BUCKET must match featureStore.offlineS3Bucket).
#   oc apply -f argocd/application.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: fd-gitops
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/feast: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-fd-gitops-admin
  namespace: fd-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
  - kind: ServiceAccount
    name: argocd-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-gitops
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/varunchach/fd_demo.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # --- edit these for your site (not in chart defaults) ---
        - name: pipelines.s3Host
          value: bls3-rhoat-non-prod.bajajlife.com
        - name: pipelines.s3Bucket
          value: kubeflow-pipelines
        - name: featureStore.offlineS3Bucket
          value: feature_store
        # registry path auto-builds: s3://feature_store/fd-gitops/registry.db
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
