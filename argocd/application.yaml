apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-mlops
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/varunchach/fd_demo.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values.yaml
        - values-demo.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fraud-mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
