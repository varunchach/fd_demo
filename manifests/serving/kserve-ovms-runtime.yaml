apiVersion: v1
items:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ServingRuntime
  metadata:
    annotations:
      opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
      opendatahub.io/runtime-version: v2026.1.0
      openshift.io/display-name: OpenVINO Model Server
    labels:
      opendatahub.io/dashboard: "true"
    name: kserve-ovms
  spec:
    annotations:
      opendatahub.io/kserve-runtime: ovms
      prometheus.io/path: /metrics
      prometheus.io/port: "8888"
    containers:
    - args:
      - --model_name={{.Name}}
      - --port=8001
      - --rest_port=8888
      - --model_path=/mnt/models
      - --file_system_poll_wait_seconds=0
      - --metrics_enable
      image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9@sha256:0d36cf373c78768fb10c295cb7496f7c22160c8528a8c4613338035c04d72a3d
      name: kserve-container
      ports:
      - containerPort: 8888
        protocol: TCP
    multiModel: false
    protocolVersions:
    - v2
    - grpc-v2
    supportedModelFormats:
    - autoSelect: true
      name: openvino_ir
      version: opset13
    - name: onnx
      version: "1"
    - autoSelect: true
      name: tensorflow
      version: "1"
    - autoSelect: true
      name: tensorflow
      version: "2"
    - autoSelect: true
      name: paddle
      version: "2"
    - autoSelect: true
      name: pytorch
      version: "2"
kind: List
metadata: {}
