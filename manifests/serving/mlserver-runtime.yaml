apiVersion: v1
items:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ServingRuntime
  metadata:
    annotations:
      opendatahub.io/runtime-version: 1.7.1
      openshift.io/display-name: MLServer ServingRuntime for KServe
      serving.kserve.io/server-type: mlserver
    labels:
      opendatahub.io/dashboard: "true"
    name: mlserver-runtime
  spec:
    annotations:
      monitoring.opendatahub.io/scrape: "true"
      opendatahub.io/kserve-runtime: mlserver
      prometheus.io/path: /metrics
      prometheus.io/port: "8082"
    containers:
    - env:
      - name: MLSERVER_MODEL_IMPLEMENTATION
        value: '{{.Labels.modelClass}}'
      - name: MLSERVER_HTTP_PORT
        value: "8080"
      - name: MLSERVER_MODELS_DIR
        value: /mnt/models
      image: registry.redhat.io/rhoai/odh-mlserver-rhel9@sha256:00e7adb823dc1edb2c3dc1f51dfa5a8745876c7756cbcaae5c118f4fd9ecbaa0
      livenessProbe:
        failureThreshold: 6
        httpGet:
          path: /v2/models/{{.Name}}/ready
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
      name: kserve-container
      ports:
      - containerPort: 8080
        protocol: TCP
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /v2/models/{{.Name}}/ready
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        privileged: false
        runAsNonRoot: true
      startupProbe:
        exec:
          command:
          - /bin/sh
          - -c
          - |
            [ -n "$(ls -A /mnt/models 2>/dev/null)" ]
        failureThreshold: 1
        initialDelaySeconds: 1
        periodSeconds: 1
    multiModel: false
    protocolVersions:
    - v2
    supportedModelFormats:
    - name: sklearn
      version: "0"
    - name: sklearn
      version: "1"
    - name: xgboost
      version: "1"
    - name: xgboost
      version: "2"
    - name: lightgbm
      version: "3"
    - name: lightgbm
      version: "4"
    - name: onnx
      version: "1"
kind: List
metadata: {}
