# S3 for Feast offline parquet + registry (can differ from pipeline-artifacts)
#   oc apply -f examples/secrets/feast-offline-s3.yaml -n <project>
apiVersion: v1
kind: Secret
metadata:
  name: feast-offline-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_S3_ENDPOINT: https://s3.example.com
  AWS_S3_BUCKET: feast-offline
  AWS_DEFAULT_REGION: us-east-1
