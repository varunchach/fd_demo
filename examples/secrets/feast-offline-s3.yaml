# S3 for Feast offline parquet + registry (can differ from pipeline-artifacts)
#   oc apply -f examples/secrets/feast-offline-s3.yaml -n <project>
#
# boto3 reads AWS_ENDPOINT_URL (not AWS_S3_ENDPOINT alone).
# Checksum env vars fix PutObject "x-amz-content-sha256" errors on many S3 gateways.
apiVersion: v1
kind: Secret
metadata:
  name: feast-offline-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_DEFAULT_REGION: us-east-1
  # Required for custom / private S3 (boto3 / Feast registry)
  AWS_ENDPOINT_URL: https://s3.example.com
  # Kept for seed job scripts
  AWS_S3_ENDPOINT: https://s3.example.com
  AWS_S3_BUCKET: feature-store
  AWS_S3_FORCE_PATH_STYLE: "true"
  # boto3 1.36+ checksum defaults break some S3-compatible APIs
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
