# Feast online Postgres — YOU set host AND port (example uses 6666, not 5432).
# FLAT fields only (no online_store: wrapper, no type:).
#   oc apply -f examples/secrets/fd-gitops-feast-pg.yaml -n fd-gitops
#
# Or prefer: export PG_HOST=... PG_PORT=6666 PG_USER=... PG_PASSWORD=...
#            ./scripts/apply_fd_gitops_secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: fd-gitops-feast-pg
type: Opaque
stringData:
  feature_store.yaml: |
    host: postgres.example.com
    port: 6666
    database: fd_gitops
    db_schema: public
    user: feast
    password: REPLACE_ME
    sslmode: disable
