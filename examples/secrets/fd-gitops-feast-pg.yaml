# NEW stack — Feast online Postgres (dedicated DB/schema recommended).
# FLAT fields only under feature_store.yaml (no online_store: wrapper, no type:).
#   oc apply -f examples/secrets/ -n fd-gitops
apiVersion: v1
kind: Secret
metadata:
  name: fd-gitops-feast-pg
type: Opaque
stringData:
  feature_store.yaml: |
    host: postgres.example.com
    port: 5432
    database: fd_gitops
    db_schema: public
    user: feast
    password: REPLACE_ME
    sslmode: disable
