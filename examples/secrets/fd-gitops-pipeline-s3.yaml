# NEW stack only — apply into namespace fd-gitops (not fraud-detection).
#   oc apply -f examples/secrets/ -n fd-gitops
apiVersion: v1
kind: Secret
metadata:
  name: fd-gitops-pipeline-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_ENDPOINT: https://s3.example.com
  AWS_S3_BUCKET: fd-gitops-pipeline
