# S3 for DSPA pipeline artifacts (runs, intermediate datasets, models)
#   oc apply -f examples/secrets/pipeline-artifacts.yaml -n <project>
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-artifacts
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_DEFAULT_REGION: us-east-1
  # Optional helpers used by seed/submit scripts (not required by DSPA itself):
  AWS_S3_ENDPOINT: https://s3.example.com
  AWS_S3_BUCKET: pipeline-artifacts
