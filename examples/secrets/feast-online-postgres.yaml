# Feast online store = PostgreSQL
# Verified on RHOAI Feast operator: secret value is injected UNDER online_store,
# so content must be FLAT connection fields — do NOT wrap with "online_store:"
# and do NOT include "type:" (operator sets type: postgres from the CR).
#
#   oc apply -f examples/secrets/feast-online-postgres.yaml -n <project>
#
# FeatureStore CR:
#   services.onlineStore.persistence.store.type = postgres
#   secretRef.name = feast-online-postgres
#   secretKeyName = feature_store.yaml   # optional; default key name is "postgres"
apiVersion: v1
kind: Secret
metadata:
  name: feast-online-postgres
type: Opaque
stringData:
  feature_store.yaml: |
    host: postgres.example.com
    port: 5432
    database: feast
    db_schema: public
    user: feast
    password: REPLACE_ME
    sslmode: disable   # use require if DB enforces TLS
