# Customer: fill host/user/password/database, then:
#   oc apply -f examples/secrets/feast-online-postgres.yaml -n <project>
#
# Referenced by FeatureStore:
#   services.onlineStore.persistence.store.secretRef = feast-online-postgres
#   secretKeyName = feature_store.yaml
apiVersion: v1
kind: Secret
metadata:
  name: feast-online-postgres
type: Opaque
stringData:
  # Exact Feast online_store block expected by the Feast Operator
  feature_store.yaml: |
    online_store:
      type: postgres
      host: postgres.example.com
      port: 5432
      database: feast
      db_schema: public
      user: feast
      password: REPLACE_ME
      conn_type: pool
      min_conn: 2
      max_conn: 10
      sslmode: require
