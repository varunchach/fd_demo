# Submit KFP run against DSPA (CLI — no dashboard).
# Prerequisites: ConfigMaps feast-submit-script + fraud-detection-pipeline-yaml
#   (created by scripts/oneshot.sh)
apiVersion: batch/v1
kind: Job
metadata:
  name: submit-fraud-pipeline
  namespace: fraud-detection
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: fraud-pipeline-submitter
      restartPolicy: Never
      containers:
        - name: submit
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          envFrom:
            - secretRef:
                name: pipeline-artifacts
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              value: fraud-detection
            - name: DSPA_API
              value: https://ds-pipeline-fraud-detection-dspa.fraud-detection.svc.cluster.local:8443
            - name: FEAST_URL
              value: https://feast-fraud-feature-store-online.fraud-detection.svc.cluster.local:443
            - name: MLFLOW_TRACKING_URI
              value: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow
            - name: PIPELINE_FILE
              value: /pipeline/pipeline.yaml
            - name: RUN_NAME
              value: fraud-detection-e2e
            - name: PIPELINE_SA
              value: pipeline-runner-fraud-detection-dspa
          command: ["python", "/scripts/submit_pipeline_run.py"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: pipeline
              mountPath: /pipeline
      volumes:
        - name: scripts
          configMap:
            name: feast-submit-script
        - name: pipeline
          configMap:
            name: fraud-detection-pipeline-yaml
