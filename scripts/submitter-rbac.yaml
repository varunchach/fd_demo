apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-pipeline-submitter
  namespace: fraud-detection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-pipeline-submitter-dspa
  namespace: fraud-detection
subjects:
  - kind: ServiceAccount
    name: fraud-pipeline-submitter
    namespace: fraud-detection
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
