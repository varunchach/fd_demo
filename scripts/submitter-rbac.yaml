apiVersion: v1
kind: ServiceAccount
metadata:
  name: fd-gitops-submitter
  namespace: fd-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fd-gitops-submitter-admin
  namespace: fd-gitops
subjects:
  - kind: ServiceAccount
    name: fd-gitops-submitter
    namespace: fd-gitops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
