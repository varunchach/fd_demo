apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: fraud-detection
  namespace: fraud-detection
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/mlflow-instance: mlflow
    notebooks.opendatahub.io/last-image-selection: "s2i-generic-data-science-notebook:3.5"
spec:
  template:
    spec:
      serviceAccountName: fraud-detection
      containers:
        - name: fraud-detection
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          envFrom:
            - secretRef:
                name: my-storage
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: fraud-detection-workspace
