# Manual seed Job for oneshot.sh (Argo uses PostSync Job fd-gitops-seed-offline).
apiVersion: batch/v1
kind: Job
metadata:
  name: fd-gitops-seed-offline-manual
  namespace: fd-gitops
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 --branch main https://github.com/varunchach/fd_demo.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          envFrom:
            - secretRef:
                name: fd-gitops-feast-s3
          env:
            - name: HOME
              value: /tmp
            - name: FEAST_S3_PREFIX
              value: fd-gitops/features
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install -q boto3 pyarrow scikit-learn pandas
              python /repo/scripts/seed_feast_s3.py
          volumeMounts:
            - name: repo
              mountPath: /repo
      volumes:
        - name: repo
          emptyDir: {}
