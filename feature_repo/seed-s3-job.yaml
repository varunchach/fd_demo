# Manual seed Job. Prefer: NS=... ./scripts/run_demo_e2e.sh (substitutes URL from FeatureStore).
# Or export FEAST_GIT_REPO_URL / FEAST_GIT_REVISION / FEAST_S3_PREFIX before oc apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: fd-gitops-seed-offline-manual
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              : "${FEAST_GIT_REPO_URL:?set FEAST_GIT_REPO_URL to the feature repo git URL}"
              git clone --depth 1 --branch "${FEAST_GIT_REVISION:-main}" \
                "${FEAST_GIT_REPO_URL}" /repo
          env:
            - name: FEAST_GIT_REPO_URL
              value: PLACEHOLDER_GIT_REPO_URL
            - name: FEAST_GIT_REVISION
              value: PLACEHOLDER_GIT_REVISION
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          envFrom:
            - secretRef:
                name: fd-gitops-feast-s3
          env:
            - name: HOME
              value: /tmp
            - name: FEAST_S3_PREFIX
              value: PLACEHOLDER_S3_PREFIX
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install -q boto3 pyarrow numpy pandas
              python /repo/scripts/seed_feast_s3.py
          volumeMounts:
            - name: repo
              mountPath: /repo
      volumes:
        - name: repo
          emptyDir: {}

