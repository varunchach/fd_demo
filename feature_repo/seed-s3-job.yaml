# oc apply -f feature_repo/seed-s3-job.yaml
# Needs Secret feast-s3 (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT, AWS_S3_BUCKET)
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-features-to-s3
  namespace: fraud-detection
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: registry.access.redhat.com/ubi9/python-311:latest
          envFrom:
            - secretRef:
                name: feast-s3
          env:
            - name: HOME
              value: /tmp
            - name: FEAST_S3_PREFIX
              value: fraud-detection/features
          command: ["bash", "-c"]
          args:
            - |
              set -e
              pip install -q --user boto3 pandas pyarrow scikit-learn
              export PATH=/tmp/.local/bin:$PATH
              python -c "
              import io,os
              from datetime import datetime,timedelta,timezone
              import boto3,pandas as pd
              from botocore.client import Config
              from sklearn.datasets import make_classification
              names=['distance_from_last_transaction','ratio_to_median_purchase_price','used_chip','used_pin_number','online_order','repeat_retailer']
              X,y=make_classification(n_samples=100,n_features=6,n_informative=4,n_redundant=0,weights=[0.9,0.1],class_sep=1.2,random_state=42)
              df=pd.DataFrame(X,columns=names)
              df['transaction_id']=df.index.astype('int64')
              now=datetime.now(timezone.utc)
              df['event_timestamp']=[now-timedelta(minutes=(len(df)-i)) for i in range(len(df))]
              buf=io.BytesIO(); df.to_parquet(buf,index=False); buf.seek(0)
              ep,bucket=os.environ['AWS_S3_ENDPOINT'],os.environ['AWS_S3_BUCKET']
              key=os.environ.get('FEAST_S3_PREFIX','fraud-detection/features').strip('/')+'/transactions.parquet'
              c=boto3.client('s3',endpoint_url=ep,aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='us-east-1',config=Config(s3={'addressing_style':'path'}))
              try: c.head_bucket(Bucket=bucket)
              except Exception: c.create_bucket(Bucket=bucket)
              c.put_object(Bucket=bucket,Key=key,Body=buf.getvalue())
              print('Uploaded s3://%s/%s (%d rows)'%(bucket,key,len(df)))
              "
