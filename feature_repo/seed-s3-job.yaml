# Manual seed Job. Apply with: oc apply -n "$NS" -f feature_repo/seed-s3-job.yaml
# Set FEAST_S3_PREFIX to match FeatureStore offline prefix (default ${NS}/features).
apiVersion: batch/v1
kind: Job
metadata:
  name: fd-gitops-seed-offline-manual
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 --branch main https://github.com/varunchach/fd_demo.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          envFrom:
            - secretRef:
                name: fd-gitops-feast-s3
          env:
            - name: HOME
              value: /tmp
            - name: FEAST_S3_PREFIX
              value: PLACEHOLDER_S3_PREFIX
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install -q boto3 pyarrow numpy pandas
              python /repo/scripts/seed_feast_s3.py
          volumeMounts:
            - name: repo
              mountPath: /repo
      volumes:
        - name: repo
          emptyDir: {}
