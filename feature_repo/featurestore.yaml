# Standalone apply example (prefer Helm chart). Customer architecture:
#   online = Postgres secret feast-online-postgres
#   offline parquet + registry = S3 secret feast-offline-s3
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: fraud-feature-store
  namespace: fraud-mlops
  labels:
    feature-store-ui: enabled
spec:
  feastProject: fraud_detection
  feastProjectDir:
    git:
      url: https://github.com/varunchach/fd_demo.git
      ref: main
      featureRepoPath: feature_repo
  authz:
    noAuth: true
  services:
    onlineStore:
      persistence:
        store:
          type: postgres
          secretRef:
            name: feast-online-postgres
          secretKeyName: feature_store.yaml
      server:
        envFrom:
          - secretRef:
              name: feast-offline-s3
        env:
          - name: FEAST_S3_PREFIX
            value: fraud-detection/features
          - name: AWS_S3_FORCE_PATH_STYLE
            value: "true"
    offlineStore:
      persistence:
        file:
          type: dask
    registry:
      local:
        server:
          restAPI: true
        persistence:
          file:
            path: s3://feast-registry/fraud-detection/registry.db
    ui: {}
