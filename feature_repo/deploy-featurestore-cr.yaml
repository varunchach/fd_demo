# Standalone FeatureStore CR (if you are not using the Helm/Argo CD chart).
# oc apply -f feature_repo/deploy-featurestore-cr.yaml
#
# Prerequisites: feastoperator Managed on DSC; Secrets already present if mode=postgres.
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: fraud-feature-store
  namespace: fraud-mlops
  labels:
    feature-store-ui: enabled
spec:
  feastProject: fraud_detection
  feastProjectDir:
    git:
      url: https://github.com/varunchach/fd_demo.git
      ref: main
      featureRepoPath: feature_repo
  authz:
    noAuth: true
  services:
    onlineStore:
      server: {}
    offlineStore: {}
    registry:
      local: {}
    ui: {}
