# =============================================================================
# Customer platform values (Argo CD syncs PLATFORM only)
# -----------------------------------------------------------------------------
#   - DSPA (operator-managed MariaDB)
#   - FeatureStore (Postgres online + S3 offline/registry)
#   - RBAC for optional manual jobs
#
# Site S3 host/buckets: NEVER commit — set via ./scripts/configure_argo_site.sh
# Secrets: once via ./scripts/apply_fd_gitops_secrets.sh
# Demo path after Ready: ./scripts/run_demo_e2e.sh
# =============================================================================

git:
  repoURL: https://github.com/varunchach/fd_demo.git
  revision: main

pipelines:
  enabled: true
  dspaName: fd-gitops-dspa
  deployMariaDB: true
  deployCustomMariaDB: false
  mariaDbName: fd-gitops-db
  s3Host: ""
  s3Port: "443"
  s3Scheme: https
  s3Bucket: ""
  s3Region: us-east-1
  artifactsSecret: fd-gitops-pipeline-s3
  mlflowIntegrationMode: AUTODETECT
  injectUserEnvVars: true
  externalDb:
    host: ""
    port: "3306"
    username: mlpipeline
    database: mlpipeline
    passwordSecret: fd-gitops-db
    passwordKey: password

featureStore:
  enabled: true
  name: fd-gitops-fs
  feastProject: fd_gitops
  # Always PostgreSQL for online store.
  onlinePostgresSecret: fd-gitops-feast-pg
  onlinePostgresSecretKey: feature_store.yaml
  offlineS3Secret: fd-gitops-feast-s3
  offlineS3Bucket: ""
  offlineS3Prefix: fd-gitops/features
  registryS3Path: ""
  cloneFeatureRepo: true
  localRegistry: false

# OFF by default — never block Argo sync with demo Jobs
hooks:
  enabled: false
  seedOffline: false
  materializeOnline: false
  submitPipeline: false
  cliImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  notebookImage: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
  mlflowTrackingUri: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow
  experimentName: fd-gitops-training
  runNamePrefix: fd-gitops-run
  pipelineDisplayName: fd-gitops-pipeline
  submitterSa: fd-gitops-submitter
  s3RawKey: fd-gitops/raw/transactions.csv

storage:
  pipelineArtifactsSecret: fd-gitops-pipeline-s3
