# Target namespace is set by Argo CD (fraud-detection), not here.
git:
  repoURL: https://github.com/varunchach/fd_demo.git
  revision: main

storage:
  pipelineArtifactsSecret: pipeline-artifacts

pipelines:
  dspaName: fraud-detection-dspa
  # Change these to your MinIO/S3 before first sync.
  s3Host: minio-credit-decisioning-dspa.credit-decisioning.svc.cluster.local
  s3Port: "9000"
  s3Scheme: http
  s3Bucket: pipeline-artifacts
  s3Region: us-east-1

featureStore:
  name: fraud-feature-store
  feastProject: fraud_detection
