# =============================================================================
# Customer platform values (Argo CD syncs PLATFORM only)
# -----------------------------------------------------------------------------
#   - DSPA (operator-managed MariaDB)
#   - FeatureStore (Postgres online + S3 offline/registry)
#   - RBAC for optional manual jobs
#
# Site S3 host/buckets: NEVER commit — set via ./scripts/configure_argo_site.sh
# Secrets: once via ./scripts/apply_fd_gitops_secrets.sh
# Demo path after Ready: ./scripts/run_demo_e2e.sh
# =============================================================================

# Feast cloneFeatureRepo + hook Jobs use these — NEVER bake the client fork into templates.
# Override in Argo Helm parameters (required for customer forks):
#   git.repoURL, git.revision, git.featureRepoPath
# configure_argo_site.sh sets git.repoURL from the Application's own source.repoURL
# unless FEAST_GIT_REPO_URL is exported.
git:
  repoURL: ""
  revision: main
  featureRepoPath: feature_repo
  # Private repos: create Secret with a PAT, then set tokenSecret (Argo Helm param).
  #   oc create secret generic fd-gitops-feast-git -n <ns> --from-literal=token=<PAT>
  #   helm: git.tokenSecret=fd-gitops-feast-git
  tokenSecret: ""
  tokenSecretKey: token
  # Git config insteadOf host (GitHub.com). For GHES/GitLab, override via Argo.
  authInsteadOfHost: github.com

pipelines:
  enabled: true
  dspaName: fd-gitops-dspa
  deployMariaDB: true
  deployCustomMariaDB: false
  mariaDbName: fd-gitops-db
  s3Host: ""
  s3Port: "443"
  s3Scheme: https
  s3Bucket: ""
  s3Region: us-east-1
  artifactsSecret: fd-gitops-pipeline-s3
  mlflowIntegrationMode: AUTODETECT
  injectUserEnvVars: true
  externalDb:
    host: ""
    port: "3306"
    username: mlpipeline
    database: mlpipeline
    passwordSecret: fd-gitops-db
    passwordKey: password

featureStore:
  enabled: true
  # RHOAI 3.5: enable dashboard discovery for only one Argo Application.
  # Set false on other applications; their FeatureStore services remain deployed.
  uiEnabled: true
  name: fd-gitops-fs
  feastProject: fd_gitops
  # Online Postgres + S3: do NOT put host/port/password/keys here.
  # Client supplies them via existing secret names (apply_fd_gitops_secrets.sh).
  # Feast operator reads feature_store.yaml / AWS_* from those secrets as-is.
  onlinePostgresSecret: fd-gitops-feast-pg
  onlinePostgresSecretKey: feature_store.yaml
  offlineS3Secret: fd-gitops-feast-s3
  offlineS3Bucket: ""
  offlineS3Prefix: fd-gitops/features
  registryS3Path: ""
  cloneFeatureRepo: true
  localRegistry: false
  # RHOAI Feature Store UI: dashboard NS must reach Feast registry (pod ports).
  allowDashboardNetworkPolicy: true
  dashboardNamespace: redhat-ods-applications
  registryRestPort: 6573
  registryGrpcPort: 6571

# OFF by default — never block Argo sync with demo Jobs
hooks:
  enabled: false
  seedOffline: false
  materializeOnline: false
  submitPipeline: false
  cliImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  notebookImage: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
  mlflowTrackingUri: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow
  experimentName: fd-gitops-training
  runNamePrefix: fd-gitops-run
  pipelineDisplayName: fd-gitops-pipeline
  submitterSa: fd-gitops-submitter
  s3RawKey: fd-gitops/raw/transactions.csv

storage:
  pipelineArtifactsSecret: fd-gitops-pipeline-s3

