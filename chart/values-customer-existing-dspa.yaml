# Use when namespace already has DSPA named "dspa" (Service ds-pipeline-dspa).
#   helm upgrade --install fraud-detection ./chart -n fraud-detection \
#     -f values.yaml -f values-customer-existing-dspa.yaml
#
# Or point Argo Application at this value file via helm.parameters / valueFiles.
pipelines:
  enabled: false   # do not create/overwrite existing DSPA

hooks:
  dspaApiOverride: https://ds-pipeline-dspa.fraud-detection.svc.cluster.local:8443
  pipelineSaOverride: pipeline-runner-dspa
