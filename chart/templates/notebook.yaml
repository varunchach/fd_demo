apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.workbench.name }}-workspace
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.workbench.storageSize }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workbench.name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.workbench.name }}-edit
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workbench.name }}
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: {{ .Values.workbench.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/mlflow-instance: {{ .Values.workbench.mlflowInstanceName }}
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.workbench.name }}
      initContainers:
        - name: clone-repo
          image: {{ .Values.workbench.image }}
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -d /opt/app-root/src/fd_demo ]; then
                git clone --branch {{ .Values.git.revision }} {{ .Values.git.repoURL }} /opt/app-root/src/fd_demo
              else
                echo "fd_demo already present, skipping clone"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      containers:
        - name: {{ .Values.workbench.name }}
          image: {{ .Values.workbench.image }}
          resources:
            requests:
              cpu: {{ .Values.workbench.cpuRequest | quote }}
              memory: {{ .Values.workbench.memoryRequest }}
            limits:
              cpu: {{ .Values.workbench.cpuLimit | quote }}
              memory: {{ .Values.workbench.memoryLimit }}
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.storage.myStorageSecret }}
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.workbench.name }}-workspace
