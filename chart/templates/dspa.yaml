apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: {{ .Values.pipelines.dspaName }}
  namespace: {{ .Release.Namespace }}
spec:
  dspVersion: v2
  apiServer:
    deploy: true
    enableSamplePipeline: false
    pipelineStore: kubernetes
  persistenceAgent:
    deploy: true
  scheduledWorkflow:
    deploy: true
  database:
    customExtraParams: '{"tls":"false"}'
    mariaDB:
      deploy: false
{{- if .Values.pipelines.deployMariaDB }}
    externalDB:
      host: fraud-db.{{ .Release.Namespace }}.svc.cluster.local
      port: "3306"
      username: mlpipeline
      pipelineDBName: mlpipeline
      passwordSecret:
        name: fraud-db
        key: password
{{- else }}
    externalDB:
      host: {{ .Values.pipelines.externalDb.host | quote }}
      port: {{ .Values.pipelines.externalDb.port | quote }}
      username: {{ .Values.pipelines.externalDb.username | quote }}
      pipelineDBName: {{ .Values.pipelines.externalDb.database | quote }}
      passwordSecret:
        name: {{ .Values.pipelines.externalDb.passwordSecret }}
        key: {{ .Values.pipelines.externalDb.passwordKey }}
{{- end }}
  objectStorage:
    externalStorage:
      host: {{ .Values.pipelines.s3Host }}
      port: {{ .Values.pipelines.s3Port | quote }}
      bucket: {{ .Values.pipelines.s3Bucket }}
      scheme: {{ .Values.pipelines.s3Scheme }}
      region: {{ .Values.pipelines.s3Region }}
      s3CredentialsSecret:
        secretName: {{ .Values.pipelines.artifactsSecret | default .Values.storage.pipelineArtifactsSecret }}
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
  mlflow:
    integrationMode: AUTODETECT
    injectUserEnvVars: true
