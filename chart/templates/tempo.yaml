apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: {{ .Values.tempo.name }}
  namespace: {{ .Release.Namespace }}
spec:
  storage:
    traces:
      backend: pv
      size: {{ .Values.tempo.storageSize }}
  ingestion:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
  jaegerui:
    enabled: true
    route:
      enabled: true
      termination: edge
