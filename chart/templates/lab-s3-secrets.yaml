{{- /*
  Lab / dummy only: S3 secrets for MinIO (or similar) from values.
  Same secret names/keys the chart already expects — does not change providers.
  Customer: leave lab.createS3Secrets=false; use apply_fd_gitops_secrets.sh instead.
*/ -}}
{{- if .Values.lab.createS3Secrets }}
{{- if not .Values.lab.s3.accessKey }}
{{- fail "lab.createS3Secrets=true requires lab.s3.accessKey / secretKey / endpoint" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pipelines.artifactsSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.lab.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.lab.s3.secretKey | quote }}
  AWS_DEFAULT_REGION: {{ .Values.pipelines.s3Region | default "us-east-1" | quote }}
  AWS_S3_ENDPOINT: {{ .Values.lab.s3.endpoint | quote }}
  AWS_S3_BUCKET: {{ .Values.pipelines.s3Bucket | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.featureStore.offlineS3Secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.lab.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.lab.s3.secretKey | quote }}
  AWS_DEFAULT_REGION: {{ .Values.pipelines.s3Region | default "us-east-1" | quote }}
  AWS_ENDPOINT_URL: {{ .Values.lab.s3.endpoint | quote }}
  AWS_S3_ENDPOINT: {{ .Values.lab.s3.endpoint | quote }}
  AWS_S3_BUCKET: {{ .Values.featureStore.offlineS3Bucket | quote }}
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
{{- end }}
