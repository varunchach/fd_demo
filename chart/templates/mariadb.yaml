{{- /* Custom MariaDB removed — use DSPA mariaDB.deploy: true (pipelines.deployMariaDB).
     Keep file so Argo prune can drop the old fd-gitops-db Deployment/Service/Secret. */ -}}
{{- if and .Values.pipelines.enabled .Values.pipelines.deployCustomMariaDB }}
{{- $db := .Values.pipelines.mariaDbName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  password: fdgitops
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: {{ $db }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $db }}
  template:
    metadata:
      labels:
        app: {{ $db }}
    spec:
      containers:
        - name: mariadb
          image: registry.redhat.io/rhel9/mariadb-105:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: fdgitops
            - name: MYSQL_DATABASE
              value: mlpipeline
            - name: MYSQL_USER
              value: mlpipeline
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}
                  key: password
{{- end }}
