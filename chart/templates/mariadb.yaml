{{- if and .Values.pipelines.enabled .Values.pipelines.deployMariaDB }}
{{- $db := .Values.pipelines.mariaDbName }}
# Fresh MariaDB for THIS demo's DSPA only (not shared with other projects).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  password: fdgitops
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: {{ $db }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $db }}
  template:
    metadata:
      labels:
        app: {{ $db }}
    spec:
      containers:
        - name: mariadb
          image: registry.redhat.io/rhel9/mariadb-105:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: fdgitops
            - name: MYSQL_DATABASE
              value: mlpipeline
            - name: MYSQL_USER
              value: mlpipeline
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}
                  key: password
          readinessProbe:
            exec:
              command: ["bash", "-c", "mysqladmin ping -h 127.0.0.1 -u mlpipeline -pfdgitops --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
{{- end }}
