apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: {{ .Values.featureStore.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    feature-store-ui: enabled
spec:
  feastProject: {{ .Values.featureStore.feastProject }}
  feastProjectDir:
    git:
      url: {{ .Values.git.repoURL }}
      ref: {{ .Values.git.revision }}
      featureRepoPath: feature_repo
  authz:
    noAuth: true
  services:
    onlineStore:
      server:
        envFrom:
          - secretRef:
              name: {{ .Values.storage.pipelineArtifactsSecret }}
        env:
          - name: FEAST_S3_PREFIX
            value: fraud-detection/features
          - name: AWS_DEFAULT_REGION
            value: us-east-1
          - name: AWS_S3_FORCE_PATH_STYLE
            value: "true"
    offlineStore: {}
    registry:
      local: {}
    ui: {}
