{{- if .Values.featureStore.enabled }}
{{- $useLocalReg := .Values.featureStore.localRegistry | default false }}
{{- if and (not $useLocalReg) (not .Values.featureStore.offlineS3Bucket) }}
{{- fail "featureStore.offlineS3Bucket is required unless featureStore.localRegistry=true" }}
{{- end }}
{{- $registryPath := .Values.featureStore.registryS3Path }}
{{- if $useLocalReg }}
{{- $registryPath = .Values.featureStore.localRegistryPath | default "/feast-data/registry.db" }}
{{- else if not $registryPath }}
{{- $registryPath = printf "s3://%s/%s/registry.db" .Values.featureStore.offlineS3Bucket .Release.Namespace }}
{{- end }}
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: {{ .Values.featureStore.name }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.featureStore.uiEnabled }}
  labels:
    feature-store-ui: enabled
{{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  feastProject: {{ .Values.featureStore.feastProject }}
{{- if .Values.featureStore.cloneFeatureRepo }}
{{- if not .Values.git.repoURL }}
{{- fail "git.repoURL is required when featureStore.cloneFeatureRepo=true (set Argo param git.repoURL to the customer fork)" }}
{{- end }}
  feastProjectDir:
    git:
      url: {{ .Values.git.repoURL | quote }}
      ref: {{ .Values.git.revision | default "main" | quote }}
      featureRepoPath: {{ .Values.git.featureRepoPath | default "feature_repo" | quote }}
{{- end }}
  authz:
    noAuth: true
  services:
    onlineStore:
      persistence:
        store:
          type: postgres
          secretRef:
            name: {{ .Values.featureStore.onlinePostgresSecret }}
          secretKeyName: {{ .Values.featureStore.onlinePostgresSecretKey }}
{{- if not $useLocalReg }}
      server:
        envFrom:
          - secretRef:
              name: {{ .Values.featureStore.offlineS3Secret }}
        env:
          - name: FEAST_S3_PREFIX
            value: {{ .Values.featureStore.offlineS3Prefix | quote }}
          - name: AWS_S3_FORCE_PATH_STYLE
            value: "true"
          - name: AWS_REQUEST_CHECKSUM_CALCULATION
            value: WHEN_REQUIRED
          - name: AWS_RESPONSE_CHECKSUM_VALIDATION
            value: WHEN_REQUIRED
{{- else }}
      server: {}
{{- end }}
    offlineStore:
      persistence:
        file:
          type: dask
    registry:
      local:
        server:
          restAPI: true
{{- if not $useLocalReg }}
          envFrom:
            - secretRef:
                name: {{ .Values.featureStore.offlineS3Secret }}
          env:
            - name: FEAST_S3_PREFIX
              value: {{ .Values.featureStore.offlineS3Prefix | quote }}
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: WHEN_REQUIRED
{{- end }}
        persistence:
          file:
            path: {{ $registryPath | quote }}
    # UI also reads registry from S3 — must have the same credentials (NoCredentialsError otherwise)
{{- if not $useLocalReg }}
    ui:
      envFrom:
        - secretRef:
            name: {{ .Values.featureStore.offlineS3Secret }}
      env:
        - name: FEAST_S3_PREFIX
          value: {{ .Values.featureStore.offlineS3Prefix | quote }}
        - name: AWS_S3_FORCE_PATH_STYLE
          value: "true"
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: WHEN_REQUIRED
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: WHEN_REQUIRED
{{- else }}
    ui: {}
{{- end }}
{{- end }}

