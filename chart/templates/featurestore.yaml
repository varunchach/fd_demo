{{- if .Values.featureStore.enabled }}
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: {{ .Values.featureStore.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    feature-store-ui: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  feastProject: {{ .Values.featureStore.feastProject }}
  feastProjectDir:
    git:
      url: {{ .Values.git.repoURL }}
      ref: {{ .Values.git.revision }}
      featureRepoPath: feature_repo
  authz:
    noAuth: true
  services:
    # Online serving → customer PostgreSQL
    onlineStore:
      persistence:
        store:
          type: postgres
          secretRef:
            name: {{ .Values.featureStore.onlinePostgresSecret }}
          secretKeyName: {{ .Values.featureStore.onlinePostgresSecretKey }}
      server:
        # AWS env so materialize / FileSource can read offline S3
        envFrom:
          - secretRef:
              name: {{ .Values.featureStore.offlineS3Secret }}
        env:
          - name: FEAST_S3_PREFIX
            value: {{ .Values.featureStore.offlineS3Prefix | quote }}
          - name: AWS_S3_FORCE_PATH_STYLE
            value: "true"
          # Avoid PutObject x-amz-content-sha256 InvalidArgument on S3 gateways
          - name: AWS_REQUEST_CHECKSUM_CALCULATION
            value: WHEN_REQUIRED
          - name: AWS_RESPONSE_CHECKSUM_VALIDATION
            value: WHEN_REQUIRED
    # Offline = file/dask reading S3 parquet defined in feature_repo/features.py
    offlineStore:
      persistence:
        file:
          type: dask
    # Registry metadata on S3
    registry:
      local:
        server:
          restAPI: true
          envFrom:
            - secretRef:
                name: {{ .Values.featureStore.offlineS3Secret }}
          env:
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: WHEN_REQUIRED
        persistence:
          file:
            path: {{ .Values.featureStore.registryS3Path | quote }}
    # UI also reads S3 registry — needs same AWS env as registry/online
    ui:
      envFrom:
        - secretRef:
            name: {{ .Values.featureStore.offlineS3Secret }}
      env:
        - name: AWS_S3_FORCE_PATH_STYLE
          value: "true"
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: WHEN_REQUIRED
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: WHEN_REQUIRED
{{- end }}
