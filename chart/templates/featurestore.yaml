apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: {{ .Values.featureStore.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    feature-store-ui: enabled
spec:
  feastProject: {{ .Values.featureStore.feastProject }}
  feastProjectDir:
    git:
      url: {{ .Values.git.repoURL }}
      ref: {{ .Values.git.revision }}
      featureRepoPath: feature_repo
  authz:
    noAuth: true
  services:
    onlineStore:
      server: {}
    offlineStore: {}
    registry:
      local: {}
    ui: {}
