{{- if .Values.featureStore.enabled }}
{{- /* Lab can use local registry (official sample style). Customer uses S3 path. */ -}}
{{- $useLocalReg := .Values.featureStore.localRegistry | default false }}
{{- if and (not $useLocalReg) (not .Values.featureStore.offlineS3Bucket) }}
{{- fail "featureStore.offlineS3Bucket is required unless featureStore.localRegistry=true" }}
{{- end }}
{{- $registryPath := .Values.featureStore.registryS3Path }}
{{- if $useLocalReg }}
{{- $registryPath = .Values.featureStore.localRegistryPath | default "/feast-data/registry.db" }}
{{- else if not $registryPath }}
{{- $registryPath = printf "s3://%s/fd-gitops/registry.db" .Values.featureStore.offlineS3Bucket }}
{{- end }}
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: {{ .Values.featureStore.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    feature-store-ui: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  feastProject: {{ .Values.featureStore.feastProject }}
{{- if .Values.featureStore.cloneFeatureRepo | default true }}
  feastProjectDir:
    git:
      url: {{ .Values.git.repoURL }}
      ref: {{ .Values.git.revision }}
      featureRepoPath: feature_repo
{{- end }}
  authz:
    noAuth: true
  services:
    # Online = PostgreSQL only (never Redis/MariaDB)
    onlineStore:
      persistence:
        store:
          type: postgres
          secretRef:
            name: {{ .Values.featureStore.onlinePostgresSecret }}
          secretKeyName: {{ .Values.featureStore.onlinePostgresSecretKey }}
      server:
{{- if not $useLocalReg }}
        envFrom:
          - secretRef:
              name: {{ .Values.featureStore.offlineS3Secret }}
        env:
          - name: FEAST_S3_PREFIX
            value: {{ .Values.featureStore.offlineS3Prefix | quote }}
          - name: AWS_S3_FORCE_PATH_STYLE
            value: "true"
          - name: AWS_REQUEST_CHECKSUM_CALCULATION
            value: WHEN_REQUIRED
          - name: AWS_RESPONSE_CHECKSUM_VALIDATION
            value: WHEN_REQUIRED
{{- end }}
    offlineStore:
      persistence:
        file:
          type: dask
    registry:
      local:
        server:
          restAPI: true
{{- if not $useLocalReg }}
          envFrom:
            - secretRef:
                name: {{ .Values.featureStore.offlineS3Secret }}
          env:
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: WHEN_REQUIRED
{{- end }}
        persistence:
          file:
            path: {{ $registryPath | quote }}
    ui: {}
{{- end }}
