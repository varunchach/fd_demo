# Requires ConfigMap fraud-mlops-pipeline-yaml (from pipeline.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-mlops-submit-run
  namespace: fraud-mlops
spec:
  ttlSecondsAfterFinished: 900
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: submit
          image: python:3.11-slim
          envFrom:
            - secretRef:
                name: pipeline-artifacts
          env:
            - name: HOME
              value: /tmp
            - name: PIP_CACHE_DIR
              value: /tmp/pip-cache
            - name: PIPELINE_HOST
              value: https://ds-pipeline-fraud-mlops-dspa.fraud-mlops.svc:8443
            - name: FEAST_URL
              value: https://feast-fraud-feature-store-online.fraud-mlops.svc.cluster.local:443
            - name: MLFLOW_URI
              value: https://mlflow.redhat-ods-applications.svc:8443/mlflow
          volumeMounts:
            - name: pipe
              mountPath: /pipe
          command: ["bash", "-c"]
          args:
            - |
              set -e
              pip install -q --user 'kfp==2.17.0' urllib3
              export PATH="$HOME/.local/bin:$PATH"
              python <<'PY'
              import os, time
              import urllib3
              urllib3.disable_warnings()
              from kfp.client import Client

              with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                  token = f.read().strip()

              ca = "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
              if not os.path.exists(ca):
                  ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              client = Client(host=os.environ["PIPELINE_HOST"], existing_token=token, ssl_ca_cert=ca)
              path = "/pipe/pipeline.yaml"
              try:
                  p = client.upload_pipeline(path, pipeline_name="fraud-mlops-pipeline")
                  pid = p.pipeline_id
                  print("uploaded", pid)
              except Exception as e:
                  print("upload:", e)
                  pipes = (client.list_pipelines().pipelines) or []
                  pid = next((x.pipeline_id for x in pipes if "fraud-mlops" in (x.display_name or "")), None)
                  if not pid:
                      raise SystemExit("no pipeline id")
                  print("existing", pid)

              params = {
                  "s3_endpoint": os.environ["AWS_S3_ENDPOINT"],
                  "s3_bucket": os.environ.get("AWS_S3_BUCKET", "pipeline-artifacts"),
                  "aws_access_key_id": os.environ["AWS_ACCESS_KEY_ID"],
                  "aws_secret_access_key": os.environ["AWS_SECRET_ACCESS_KEY"],
                  "feast_online_server_url": os.environ["FEAST_URL"],
                  "mlflow_tracking_uri": os.environ["MLFLOW_URI"],
                  "s3_key": "fraud-mlops/raw/transactions.csv",
                  "mlflow_experiment": "fraud-mlops",
              }
              exp = client.create_experiment("fraud-mlops-demo")
              run = client.run_pipeline(
                  experiment_id=exp.experiment_id,
                  job_name="fraud-mlops-e2e",
                  pipeline_id=pid,
                  params=params,
              )
              print("RUN", run.run_id)
              state = "?"
              for _ in range(90):
                  r = client.get_run(run.run_id)
                  state = getattr(r, "state", None) or "?"
                  print("state", state)
                  if str(state).upper() in ("SUCCEEDED", "FAILED", "ERROR", "CANCELED"):
                      break
                  time.sleep(15)
              print("FINAL", state)
              if str(state).upper() != "SUCCEEDED":
                  raise SystemExit(1)
              PY
      volumes:
        - name: pipe
          configMap:
            name: fraud-mlops-pipeline-yaml
